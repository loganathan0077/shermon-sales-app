<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Configuration Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #f12711;
            margin-bottom: 10px;
        }

        h2 {
            color: #333;
            border-bottom: 2px solid #f5af19;
            padding-bottom: 10px;
            margin-top: 30px;
        }

        .check-item {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 5px solid #ccc;
        }

        .check-item.success {
            background: #d4edda;
            border-left-color: #28a745;
        }

        .check-item.error {
            background: #f8d7da;
            border-left-color: #dc3545;
        }

        .check-item.warning {
            background: #fff3cd;
            border-left-color: #ffc107;
        }

        .check-item.info {
            background: #d1ecf1;
            border-left-color: #17a2b8;
        }

        .icon {
            font-size: 20px;
            margin-right: 10px;
        }

        button {
            background: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
        }

        .summary {
            font-size: 18px;
            font-weight: bold;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔍 Firebase Configuration Checker</h1>
        <p>This tool will verify your Firebase setup for Sales App</p>

        <button onclick="runAllChecks()">🚀 Run All Checks</button>
        <button onclick="location.reload()">🔄 Refresh</button>

        <div id="summary"></div>

        <h2>1. Firebase Configuration</h2>
        <div id="configCheck"></div>

        <h2>2. Authentication Status</h2>
        <div id="authCheck"></div>

        <h2>3. Firestore Connection</h2>
        <div id="firestoreCheck"></div>

        <h2>4. Data Sync Test</h2>
        <div id="syncCheck"></div>

        <h2>5. Security Rules</h2>
        <div id="rulesCheck"></div>

        <h2>6. Service Worker</h2>
        <div id="swCheck"></div>

        <h2>Configuration Details</h2>
        <div id="configDetails"></div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let checkResults = {
            passed: 0,
            failed: 0,
            warnings: 0
        };

        function addCheck(elementId, status, title, message, details = '') {
            const div = document.getElementById(elementId);
            const checkDiv = document.createElement('div');
            checkDiv.className = `check-item ${status}`;

            let icon = '❓';
            if (status === 'success') { icon = '✅'; checkResults.passed++; }
            if (status === 'error') { icon = '❌'; checkResults.failed++; }
            if (status === 'warning') { icon = '⚠️'; checkResults.warnings++; }
            if (status === 'info') { icon = 'ℹ️'; }

            checkDiv.innerHTML = `
                <span class="icon">${icon}</span>
                <strong>${title}</strong><br>
                ${message}
                ${details ? `<pre>${details}</pre>` : ''}
            `;
            div.appendChild(checkDiv);
        }

        function updateSummary() {
            const summaryDiv = document.getElementById('summary');
            const total = checkResults.passed + checkResults.failed + checkResults.warnings;
            const allPassed = checkResults.failed === 0;

            summaryDiv.className = `summary ${allPassed ? 'check-item success' : 'check-item error'}`;
            summaryDiv.innerHTML = `
                <div style="font-size: 24px; margin-bottom: 10px;">
                    ${allPassed ? '🎉 All Checks Passed!' : '⚠️ Issues Found'}
                </div>
                ✅ Passed: ${checkResults.passed} | 
                ❌ Failed: ${checkResults.failed} | 
                ⚠️ Warnings: ${checkResults.warnings}
            `;
        }

        window.runAllChecks = async function () {
            // Reset
            checkResults = { passed: 0, failed: 0, warnings: 0 };
            document.getElementById('configCheck').innerHTML = '';
            document.getElementById('authCheck').innerHTML = '';
            document.getElementById('firestoreCheck').innerHTML = '';
            document.getElementById('syncCheck').innerHTML = '';
            document.getElementById('rulesCheck').innerHTML = '';
            document.getElementById('swCheck').innerHTML = '';
            document.getElementById('summary').innerHTML = '<p>Running checks...</p>';

            // Check 1: Firebase Config
            try {
                if (auth && db) {
                    addCheck('configCheck', 'success', 'Firebase Initialized',
                        'Firebase SDK is properly initialized');

                    const config = auth.app.options;
                    addCheck('configCheck', 'success', 'Project ID',
                        `Connected to: ${config.projectId}`);

                    document.getElementById('configDetails').innerHTML = `<pre>${JSON.stringify(config, null, 2)}</pre>`;
                } else {
                    addCheck('configCheck', 'error', 'Firebase Not Initialized',
                        'Firebase SDK failed to initialize');
                }
            } catch (error) {
                addCheck('configCheck', 'error', 'Configuration Error', error.message);
            }

            // Check 2: Authentication
            try {
                const user = await new Promise((resolve) => {
                    onAuthStateChanged(auth, (user) => resolve(user));
                });

                if (user) {
                    addCheck('authCheck', 'success', 'User Authenticated',
                        `Logged in as: ${user.email}`);
                    addCheck('authCheck', 'success', 'User ID',
                        `UID: ${user.uid}`);

                    // Check 3: Firestore Connection
                    try {
                        const userDocRef = doc(db, 'users', user.uid);
                        const userDoc = await getDoc(userDocRef);

                        if (userDoc.exists()) {
                            const data = userDoc.data();
                            addCheck('firestoreCheck', 'success', 'Firestore Connected',
                                'Successfully connected to Firestore');
                            addCheck('firestoreCheck', 'success', 'User Data Found',
                                `Products: ${(data.products || []).length}, Sales: ${(data.sales || []).length}`);

                            // Check 4: Data Sync Test
                            const testData = {
                                testField: 'Firebase Check - ' + new Date().toISOString(),
                                lastCheck: new Date().toISOString()
                            };

                            await setDoc(userDocRef, testData, { merge: true });
                            addCheck('syncCheck', 'success', 'Write Test',
                                'Successfully wrote test data to Firestore');

                            const verifyDoc = await getDoc(userDocRef);
                            if (verifyDoc.data().testField === testData.testField) {
                                addCheck('syncCheck', 'success', 'Read Test',
                                    'Successfully read test data from Firestore');
                            } else {
                                addCheck('syncCheck', 'error', 'Read Test Failed',
                                    'Data mismatch after write');
                            }
                        } else {
                            addCheck('firestoreCheck', 'warning', 'No User Data',
                                'User document exists but has no data yet');
                            addCheck('syncCheck', 'info', 'First Time User',
                                'Data will be created when you add products/sales');
                        }
                    } catch (error) {
                        addCheck('firestoreCheck', 'error', 'Firestore Error',
                            error.message);

                        if (error.code === 'permission-denied') {
                            addCheck('rulesCheck', 'error', 'Permission Denied',
                                'Firestore security rules are blocking access. Check Firebase Console → Firestore → Rules');
                        }
                    }
                } else {
                    addCheck('authCheck', 'warning', 'Not Logged In',
                        'Please login to test Firestore connection');
                    addCheck('firestoreCheck', 'info', 'Skipped',
                        'Login required to test Firestore');
                    addCheck('syncCheck', 'info', 'Skipped',
                        'Login required to test sync');
                }
            } catch (error) {
                addCheck('authCheck', 'error', 'Authentication Error', error.message);
            }

            // Check 5: Security Rules Info
            addCheck('rulesCheck', 'info', 'Security Rules Location',
                'Firebase Console → Firestore Database → Rules');
            addCheck('rulesCheck', 'warning', 'Recommended Rules',
                'Make sure rules allow authenticated users to access their own data',
                `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{userId} {
      allow read, write: if request.auth != null && request.auth.uid == userId;
    }
  }
}`);

            // Check 6: Service Worker
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                if (registrations.length > 0) {
                    addCheck('swCheck', 'success', 'Service Worker Registered',
                        `Active: ${registrations[0].active ? 'Yes' : 'No'}`);
                } else {
                    addCheck('swCheck', 'warning', 'No Service Worker',
                        'PWA features may not work');
                }
            } else {
                addCheck('swCheck', 'warning', 'Service Worker Not Supported',
                    'Browser does not support service workers');
            }

            updateSummary();
        };

        // Auto-run checks on load
        window.addEventListener('load', () => {
            setTimeout(runAllChecks, 500);
        });
    </script>
</body>

</html>
